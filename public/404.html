<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Renamer-X</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 64px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 11px 20px;
            background: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <main class="error-card">
        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist or may have been moved.
        </p>

        <a href="/">
            Back to Renamer-X
        </a>
    </main>

</body>
</html>
